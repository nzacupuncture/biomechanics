# Runs the anatomy tests, then publishes app/ to GitHub Pages.
# Enable once: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp file links with this commit so browsers fetch fresh code after every publish
      # (GitHub Pages lets browsers keep files for 10 minutes). Locally they stay "?v=dev".
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" app/index.html app/js/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
